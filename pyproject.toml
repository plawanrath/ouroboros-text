[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouroboros-text"
version = "0.1.0"
description = "Round-trip translation of LaTeX and Markdown through a pivot language, using a local model"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pylatexenc>=2.10",
    "huggingface-hub>=0.23",
    # 0.3.35 is the first release whose vendored llama.cpp knows the
    # "muse-glimmer" architecture; 0.3.34 fails to load the model at all.
    "llama-cpp-python>=0.3.35",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ouroboros = "ouroboros.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ouroboros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires the local GGUF model (slow, not run in CI)"]

[tool.ruff]
line-length = 100
